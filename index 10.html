window.bid=add=>{const m=my();if(cur==null||!m)return;const c=lead(cur);if(c&&c.team===m)return;const amt=c?c.amt+add:(add===0?S.base:S.base+add);if(amt>mx(T(m)))return alert('বাজেট/লিমিট পার হয়ে যাচ্ছে');addDoc(collection(db,'bids'),{i:cur,p:S.players[cur],team:m,amt,ts:Date.now()})};
window.sell=()=>{const c=lead(cur);if(!c)return;setDoc(doc(db,'sold',String(cur)),{i:cur,p:c.p,team:c.team,amt:c.amt}).then(()=>setCur(null))};
window.next=()=>{const n=S.players.length;for(let k=1;k<=n;k++){const i=((cur==null?-1:cur)+k)%n;if(!isSold(i))return setCur(i)}setCur(null)};
window.pickP=()=>setCur(+$('ps').value);
window.unsell=id=>{if(confirm('Undo?'))deleteDoc(doc(db,'sold',id))};
window.login=()=>{const t=$('lt').value,p=$('lp').value.trim();if(t==='__admin'){if(p!==S.admin)return alert('ভুল PIN');me={role:'admin'}}else{const x=T(t);if(!x||x.pin!==p)return alert('ভুল PIN');me={role:'team',team:t}}localStorage.setItem('me',JSON.stringify(me));lg();adm();render()};
window.logout=()=>{me=null;localStorage.removeItem('me');lg();adm();render()};
function lg(){chatui();$('lg').innerHTML=me?'লগইন: <b>'+esc(isA()?'Admin':me.team)+'</b> <button onclick="logout()" style="padding:6px 10px">Logout</button>':'<b>ম্যানেজার / অ্যাডমিন লগইন</b><div class="g"><select id="lt" style="padding:10px">'+S.teams.map(t=>'<option>'+esc(t.n)+'</option>').join('')+'<option value="__admin">Admin</option></select><input id="lp" placeholder="PIN" inputmode="numeric" style="padding:10px"></div><button class="a" style="width:100%;margin-top:8px" onclick="login()">Login</button><div class="mut" style="margin-top:6px">শুধু দেখতে চাইলে লগইন লাগবে না</div>'}

function fly(e){if(document.querySelectorAll('.fl').length>25)return;const x=document.createElement('span');x.className='fl';x.textContent=e;x.style.left=(8+Math.random()*80)+'%';x.addEventListener('animationend',()=>x.remove());document.body.appendChild(x)}
window.react=e=>{const n=Date.now();if(n-lastE<1500)return;lastE=n;fly(e);addDoc(collection(db,'reacts'),{e,ts:n}).catch(()=>{})};
onSnapshot(query(collection(db,'reacts'),where('ts','>',Date.now()-15000)),s=>s.docChanges().forEach(c=>{if(c.type==='added'&&!c.doc.metadata.hasPendingWrites)fly(c.doc.data().e)}),()=>{});
function showChat(){const el=$('cm');if(!el)return;el.innerHTML=chatMsgs.map(m=>'<div><b>'+esc(m.who)+':</b> '+esc(m.text)+'</div>').join('')||'<span class="mut">এখনো কোনো মেসেজ নেই</span>';el.scrollTop=el.scrollHeight}
