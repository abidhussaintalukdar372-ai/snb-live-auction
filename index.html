const setCur=i=>setDoc(doc(db,'state','cur'),{i});
window.bid=add=>{const m=my();if(cur==null||!m)return;const c=lead(cur);if(c&&c.team===m)return;const amt=c?c.amt+add:(add===0?S.base:S.base+add);if(amt>mx(T(m)))return alert('বাজেট/লিমিট পার হয়ে যাচ্ছে');addDoc(collection(db,'bids'),{i:cur,p:S.players[cur],team:m,amt,ts:Date.now()})};
window.sell=()=>{const c=lead(cur);if(!c)return;setDoc(doc(db,'sold',String(cur)),{i:cur,p:c.p,team:c.team,amt:c.amt}).then(()=>setCur(null))};
window.next=()=>{const n=S.players.length;for(let k=1;k<=n;k++){const i=((cur==null?-1:cur)+k)%n;if(!isSold(i))return setCur(i)}setCur(null)};
window.pickP=()=>setCur(+$('ps').value);
window.unsell=id=>{if(confirm('Undo?'))deleteDoc(doc(db,'sold',id))};
window.login=()=>{const t=$('lt').value,p=$('lp').value.trim();if(t==='__admin'){if(p!==S.admin)return alert('ভুল PIN');me={role:'admin'}}else{const x=T(t);if(!x||x.pin!==p)return alert('ভুল PIN');me={role:'team',team:t}}localStorage.setItem('me',JSON.stringify(me));lg();adm();render()};
window.logout=()=>{me=null;localStorage.removeItem('me');lg();adm();render()};
function lg(){chatui();pchatui();$('lg').innerHTML=me?'লগইন: <b>'+esc(isA()?'Admin':me.team)+'</b> <button onclick="logout()" style="padding:6px 10px">Logout</button>':'<b>ম্যানেজার / অ্যাডমিন লগইন</b><div class="g"><select id="lt" style="padding:10px">'+S.teams.map(t=>'<option>'+esc(t.n)+'</option>').join('')+'<option value="__admin">Admin</option></select><input id="lp" placeholder="PIN" inputmode="numeric" style="padding:10px"></div><button class="a" style="width:100%;margin-top:8px" onclick="login()">Login</button><div class="mut" style="margin-top:6px">শুধু দেখতে চাইলে লগইন লাগবে না</div>'}

window.vMute=()=>{muted=!muted;stream.getAudioTracks().forEach(t=>t.enabled=!muted);vcui()};
onSnapshot(collection(db,'voice_offers'),s=>s.docChanges().forEach(async ch=>{if(ch.type!=='added'||!stream)return;const d=ch.doc.data();if(d.sid!==sid)return;if(Object.keys(pcs).length>=MAXL){deleteDoc(ch.doc.ref);return}const id=ch.doc.id,pc=new RTCPeerConnection(ICE);pcs[id]=pc;stream.getTracks().forEach(t=>pc.addTrack(t,stream));pc.onconnectionstatechange=()=>{if(pc.connectionState==='failed'||pc.connectionState==='closed'){delete pcs[id];vcui()}};await pc.setRemoteDescription({type:'offer',sdp:d.sdp});await pc.setLocalDescription(await pc.createAnswer());await gather(pc);await setDoc(doc(db,'voice_answers',id),{sdp:pc.localDescription.sdp});deleteDoc(ch.doc.ref);vcui()}),err);
window.vListen=async()=>{const au=$('au');au.play().catch(()=>{});const pc=lpc=new RTCPeerConnection(ICE);lsid=vlive.sid;pc.addTransceiver('audio',{direction:'recvonly'});pc.ontrack=e=>{au.srcObject=e.streams[0];au.play().catch(()=>alert('অডিও চালু করতে স্ক্রিনে একবার ট্যাপ করুন'))};const lid=Math.random().toString(36).slice(2);await pc.setLocalDescription(await pc.createOffer());await gather(pc);listening=true;vcui();const un=onSnapshot(doc(db,'voice_answers',lid),async s=>{if(!s.exists())return;un();await pc.setRemoteDescription({type:'answer',sdp:s.data().sdp});deleteDoc(s.ref)});await setDoc(doc(db,'voice_offers',lid),{sid:lsid,sdp:pc.localDescription.sdp,ts:Date.now()});setTimeout(()=>{if(lpc===pc&&listening&&pc.connectionState!=='connected'){vLeave();alert('অডিও সংযোগ হয়নি। আবার চেষ্টা করুন বা নেটওয়ার্ক বদলে দেখুন')}},15000)};
window.vLeave=()=>{lpc&&lpc.close();lpc=null;listening=false;$('au').srcObject=null;vcui()};
onSnapshot(doc(db,'voice','live'),s=>{vlive=s.exists()?s.data():null;if(listening&&!(vlive&&vlive.on&&vlive.sid===lsid))vLeave();vcui()},err);
const EMO=['🔥','👏','⚽','🎉'];let lastE=0,chatUn=null,chatMsgs=[];
$('eb').innerHTML=EMO.map(e=>'<button onclick="react(\''+e+'\')">'+e+'</button>').join('');
function fly(e){if(document.querySelectorAll('.fl').length>25)return;const x=document.createElement('span');x.className='fl';x.textContent=e;x.style.left=(8+Math.random()*80)+'%';x.addEventListener('animationend',()=>x.remove());document.body.appendChild(x)}
window.react=e=>{const n=Date.now();if(n-lastE<1500)return;lastE=n;fly(e);addDoc(collection(db,'reacts'),{e,ts:n}).catch(()=>{})};
onSnapshot(query(collection(db,'reacts'),where('ts','>',Date.now()-15000)),s=>s.docChanges().forEach(c=>{if(c.type==='added'&&!c.doc.metadata.hasPendingWrites)fly(c.doc.data().e)}),()=>{});
function showChat(){const el=$('cm');if(!el)return;el.innerHTML=chatMsgs.map(m=>'<div><b>'+esc(m.who)+':</b> '+esc(m.text)+'</div>').join('')||'<span class="mut">এখনো কোনো মেসেজ নেই</span>';el.scrollTop=el.scrollHeight}
window.sendChat=()=>{const i=$('ci'),t=i.value.trim().slice(0,200);if(!t||!me)return;addDoc(collection(db,'chat'),{who:isA()?'Admin':me.team,text:t,ts:Date.now()});i.value=''};
function chatui(){if(chatUn){chatUn();chatUn=null}if(!me){$('chat').innerHTML='';return}$('chat').innerHTML='<div class="c"><b>💬 ম্যানেজার চ্যাট</b> <span class="mut">(শুধু ম্যানেজার ও অ্যাডমিনের জন্য)</span><div id="cm" style="max-height:170px;overflow:auto;margin:8px 0;font-size:14px"></div><div class="g" style="grid-template-columns:1fr auto"><input id="ci" placeholder="সমস্যা বা মেসেজ লিখুন…" maxlength="200" style="padding:10px" onkeydown="if(event.key===\'Enter\')sendChat()"><button class="a" onclick="sendChat()">পাঠান</button></div></div>';chatUn=onSnapshot(collection(db,'chat'),s=>{chatMsgs=s.docs.map(d=>d.data()).sort((a,b)=>a.ts-b.ts).slice(-40);showChat()},()=>{})}
let pMsgs=[],lastP=0;
function showP(){const el=$('pm');if(!el)return;el.innerHTML=pMsgs.map(m=>'<div><b>'+esc(m.who)+':</b> '+esc(m.text)+(isA()?' <a href="#" onclick="delP(\''+m.id+'\');return false">✕</a>':'')+'</div>').join('')||'<span class="mut">এখনো কোনো মেসেজ নেই। প্রথম মেসেজ আপনিই দিন!</span>';el.scrollTop=el.scrollHeight}
window.delP=id=>deleteDoc(doc(db,'pchat',id));
window.sendP=()=>{const t=$('pi').value.trim().slice(0,150);if(!t)return;let w=isA()?'Admin':my();if(!w){w=($('pn').value||'').trim().slice(0,20);if(!w)return alert('আগে আপনার নাম লিখুন');localStorage.setItem('pname',w)}const n=Date.now();if(n-lastP<3000)return alert('একটু পরে আবার পাঠান');lastP=n;addDoc(collection(db,'pchat'),{who:w,text:t,ts:n});$('pi').value=''};
function pchatui(){$('pchat').innerHTML='<div class="c"><b>💬 পাবলিক চ্যাট</b> <span class="mut">(সবাই দেখতে পারবে)</span><div id="pm" style="max-height:200px;overflow:auto;margin:8px 0;font-size:14px"></div>'+(me?'':'<input id="pn" placeholder="আপনার নাম" maxlength="20" value="'+esc(localStorage.getItem('pname')||'')+'" style="padding:10px;width:100%;box-sizing:border-box;margin-bottom:8px">')+'<div class="g" style="grid-template-columns:1fr auto;margin-top:0"><input id="pi" placeholder="মেসেজ লিখুন…" maxlength="150" style="padding:10px" onkeydown="if(event.key===\'Enter\')sendP()"><button class="a" onclick="sendP()">পাঠান</button></div></div>';showP()}
onSnapshot(query(collection(db,'pchat'),orderBy('ts','desc'),limit(30)),s=>{pMsgs=s.docs.map(d=>({id:d.id,...d.data()})).reverse();showP()},()=>{});
lg();adm();render();
